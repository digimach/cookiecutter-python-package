---
name: pre-commit

on: pull_request  # yamllint disable-line rule:truthy

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-python@v2
            - uses: pre-commit/action@v2.0.0
        if: ${{ always() }}
