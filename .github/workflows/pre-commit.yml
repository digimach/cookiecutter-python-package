---
name: pre-commit

on: pull_request  # yamllint disable-line rule:truthy

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
            - uses: pre-commit/action@v2.0.0
        if: ${{ always() }}
